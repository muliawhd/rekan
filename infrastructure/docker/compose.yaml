# Local development only. This is not a Supabase emulator.
name: rekan-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rekan_local
      POSTGRES_USER: rekan_local
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD in infrastructure/docker/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - rekan_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rekan_local -d rekan_local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - rekan_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  rekan_postgres:
  rekan_redis:
